<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Forget versus retain held-out accuracy across Weeks 4 to 7</title>
  <desc id="desc">Scatter plot showing that no evaluated checkpoint reaches the target region of forget accuracy at or below 45 percent and retain accuracy at or above 82 percent while meeting the general-control floor.</desc>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">Forget–retain trade-off across Weeks 4–7</text>
  <text x="480" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Lower forget accuracy and higher retain accuracy are better</text>

  <rect x="100" y="80" width="173" height="163" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="111" y="101" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Joint target region</text>
  <text x="111" y="119" font-family="Arial, sans-serif" font-size="11" fill="#166534">forget ≤45%, retain ≥82%</text>

  <g stroke="#d1d5db" stroke-width="1">
    <line x1="100" y1="520" x2="850" y2="520"/>
    <line x1="100" y1="457" x2="850" y2="457"/>
    <line x1="100" y1="394" x2="850" y2="394"/>
    <line x1="100" y1="331" x2="850" y2="331"/>
    <line x1="100" y1="269" x2="850" y2="269"/>
    <line x1="100" y1="206" x2="850" y2="206"/>
    <line x1="100" y1="143" x2="850" y2="143"/>
    <line x1="100" y1="80" x2="850" y2="80"/>
    <line x1="100" y1="80" x2="100" y2="520"/>
    <line x1="215" y1="80" x2="215" y2="520"/>
    <line x1="331" y1="80" x2="331" y2="520"/>
    <line x1="446" y1="80" x2="446" y2="520"/>
    <line x1="562" y1="80" x2="562" y2="520"/>
    <line x1="677" y1="80" x2="677" y2="520"/>
    <line x1="792" y1="80" x2="792" y2="520"/>
    <line x1="850" y1="80" x2="850" y2="520"/>
  </g>

  <g stroke="#111827" stroke-width="1.5">
    <line x1="100" y1="520" x2="850" y2="520"/>
    <line x1="100" y1="80" x2="100" y2="520"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">
    <text x="100" y="540">30</text><text x="215" y="540">40</text>
    <text x="331" y="540">50</text><text x="446" y="540">60</text>
    <text x="562" y="540">70</text><text x="677" y="540">80</text>
    <text x="792" y="540">90</text><text x="850" y="540">95</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#374151" text-anchor="end">
    <text x="92" y="524">60</text><text x="92" y="461">65</text>
    <text x="92" y="398">70</text><text x="92" y="335">75</text>
    <text x="92" y="273">80</text><text x="92" y="210">85</text>
    <text x="92" y="147">90</text><text x="92" y="84">95</text>
  </g>
  <text x="475" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#111827">Forget held-out accuracy (%) → worse forgetting</text>
  <text x="28" y="300" text-anchor="middle" transform="rotate(-90 28 300)" font-family="Arial, sans-serif" font-size="14" fill="#111827">Retain held-out accuracy (%) → better preservation</text>

  <!-- Utility-preserving selected checkpoints: filled circles -->
  <g fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5">
    <circle cx="527" cy="157" r="7"/><circle cx="492" cy="181" r="7"/>
    <circle cx="435" cy="229" r="7"/><circle cx="821" cy="116" r="7"/>
    <circle cx="792" cy="119" r="7"/>
  </g>
  <!-- Utility-violating checkpoints: triangles -->
  <g fill="#f59e0b" stroke="#92400e" stroke-width="1.5">
    <path d="M146 424 L138 439 L154 439 Z"/>
    <path d="M123 487 L115 502 L131 502 Z"/>
    <path d="M290 282 L282 297 L298 297 Z"/>
  </g>
  <!-- Baseline: diamond -->
  <path d="M821 108 L829 116 L821 124 L813 116 Z" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="11" fill="#111827">
    <text x="158" y="428">Week 4 (34.0, 66.9)</text>
    <text x="137" y="507">Week 5 aggressive (32.0, 61.9)</text>
    <text x="303" y="303">Week 7 fixed (46.5, 78.2)</text>
    <text x="538" y="151">Week 5 preserving (67.0, 88.9)</text>
    <text x="503" y="193">Week 6 (64.0, 87.0)</text>
    <text x="446" y="245">Week 7 V1 (59.0, 83.1)</text>
    <text x="651" y="92">Baseline (92.5, 91.9)</text>
    <text x="688" y="132">Week 7 V2 (92.5, 92.1)</text>
    <text x="690" y="166">Week 7 V3 (90.0, 91.9)</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" fill="#374151">
    <circle cx="105" cy="606" r="6" fill="#2563eb" stroke="#1e3a8a"/>
    <text x="118" y="610">retain and general floors met</text>
    <path d="M335 598 L328 611 L342 611 Z" fill="#f59e0b" stroke="#92400e"/>
    <text x="350" y="610">one or more utility floors missed</text>
    <path d="M603 600 L609 606 L603 612 L597 606 Z" fill="#6b7280" stroke="#374151"/>
    <text x="618" y="610">pre-unlearning baseline</text>
  </g>
</svg>
